# =================================================================
# PROYECTO   : Sistema IoT Autónomo - Cuenca Chancay-Huaral
# MÓDULO     : Capa 4 - Aplicación (Frontend "Yaku Qhawaq")
# ARCHIVO    : frontend/nginx.conf
#
# Configuración del servidor NGINX que sirve el build de producción
# (`npm run build` -> /usr/share/nginx/html) de la SPA React y actúa
# como reverse-proxy hacia el backend Node-RED, eliminando toda
# fricción de CORS en producción al unificar el origen HTTP/WS desde
# la perspectiva del navegador (mismo host:puerto que sirve la SPA).
#
# NOTA - DESPLIEGUE EN RAILWAY:
# `app_nodered_chancay:1880` era el nombre del servicio en la red
# interna de Docker Compose (uso LOCAL). En Railway, el proxy debe
# apuntar al hostname de red privada real del servicio Node-RED
# (Settings -> Networking -> Private Networking) y al puerto interno
# donde escucha realmente Node-RED (ver `Server now running at
# http://127.0.0.1:PUERTO/admin/` en sus logs), no al puerto público
# expuesto en su dominio. Si Railway le asigna un hostname distinto a
# `creative-liberation`, actualiza el valor abajo.
# =================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión para los bundles de Vite (vendor_react, vendor_charts, vendor_maps)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -------------------------------------------------------------
    # Proxy REST -> Backend Node-RED (Tab 03 - API REST /api)
    # -------------------------------------------------------------
    location /api/ {
        proxy_pass http://creative-liberation.railway.internal:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # Proxy WebSocket -> Backend Node-RED (/ws/telemetria, /ws/alertas)
    # Requiere upgrade explícito de conexión HTTP -> WebSocket.
    # -------------------------------------------------------------
    location /ws/ {
        proxy_pass http://creative-liberation.railway.internal:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------------------------------------------------------------
    # SPA Fallback: cualquier ruta de React Router (ej. /historico,
    # /telecontrol, /mapa) debe resolver a index.html para que el
    # enrutador del lado del cliente (react-router-dom) tome control.
    # -------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets versionados por hash (Vite) y favicon
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }
}
