# =================================================================
# ARCHIVO: railway.toml  (Capa 4 - Aplicación / Frontend)
# -----------------------------------------------------------------
# En Railway: New Service -> Deploy from GitHub repo ->
#   Settings -> Root Directory = Capa_4_Aplicacion/campo/frontend
# Recuerda declarar la variable VITE_API_BASE_URL (ver .env.example):
# Vite la incrusta en el build, por lo que debe existir ANTES de construir.
# =================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
