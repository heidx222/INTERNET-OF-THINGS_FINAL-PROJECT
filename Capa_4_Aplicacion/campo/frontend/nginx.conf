# =================================================================
# PROYECTO   : Sistema IoT Autónomo - Cuenca Chancay-Huaral
# MÓDULO     : Capa 4 - Aplicación (Frontend "Yaku Qhawaq")
# ARCHIVO    : frontend/nginx.conf
# -----------------------------------------------------------------
# Sirve el build de producción de la SPA React (Vite).
#
# El frontend consume la Capa 3 (FastAPI) DIRECTAMENTE por su URL pública
# (definida en VITE_API_BASE_URL al construir), tanto para REST como para
# los WebSockets (/ws/telemetria, /ws/alertas). Por eso NO se requiere
# reverse-proxy aquí: CORS está habilitado en el backend.
# =================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los bundles de Vite
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA Fallback: cualquier ruta de React Router (/historico, /telecontrol,
    # /mapa, /notificaciones) debe resolver a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché agresivo para assets versionados por hash (Vite)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }
}
