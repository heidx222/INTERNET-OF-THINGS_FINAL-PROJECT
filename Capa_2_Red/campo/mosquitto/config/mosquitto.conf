# =================================================================
# PROYECTO: Sistema IoT Autónomo - Cuenca Chancay-Huaral (Yaku Qhawaq)
# ARCHIVO:  mosquitto.conf  (Capa 2 - Red / Broker MQTT de campo)
# ENFOQUE:  Metodología STRIDE y Mosquitto Go Auth
# VERSIÓN:  Campo (Broker Mosquitto + autenticación PostgreSQL)
# =================================================================

# --- 1. Conectividad Básica ---
listener 1883 0.0.0.0

# --- 2. Mitigación de DoS y Estabilidad ---
max_connections 50
max_queued_messages 1000
# El payload JSON de telemetría (ESP32) puede superar los 512 bytes; se eleva el
# límite respecto del laboratorio (antes 2048) para dar margen a payloads enriquecidos.
message_size_limit 4096
persistence true
persistence_location /mosquitto/data/

# --- 3. Seguridad e Integridad (STRIDE - Mosquitto Go Auth) ---
# Spoofing: sin acceso anónimo, identidad gestionada en PostgreSQL + Bcrypt.
allow_anonymous false

# Ruta del plugin dentro del contenedor oficial de Go Auth
auth_plugin /mosquitto/go-auth.so

# Backend de autenticación: PostgreSQL (mismas credenciales que init.sql)
auth_opt_backends postgres
auth_opt_pg_host db_postgres
auth_opt_pg_port 5432
auth_opt_pg_dbname chancayhuaral_auth
auth_opt_pg_user adminChancayHuaral
auth_opt_pg_password adminChancayHuaral123
auth_opt_pg_sslmode disable
auth_opt_hasher bcrypt

# Consultas SQL del plugin (tablas definidas en postgres/init.sql).
# $2 = 1 (SUB/lectura) o 2 (PUB/escritura); rw = 3 concede ambos.
auth_opt_pg_userquery SELECT password_hash FROM test_user WHERE username = $1
auth_opt_pg_aclquery SELECT topic FROM test_acl WHERE username = $1 AND (rw = $2 OR rw = 3)
