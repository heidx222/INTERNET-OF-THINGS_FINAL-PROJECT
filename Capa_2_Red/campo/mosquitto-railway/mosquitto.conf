# =================================================================
# PROYECTO: Sistema IoT Autónomo - Cuenca Chancay-Huaral (Yaku Qhawaq)
# ARCHIVO:  mosquitto.conf  (Capa 2 - Red / Broker MQTT para RAILWAY)
# -----------------------------------------------------------------
# ⚠️  ESTE ES UNO DE LOS ARCHIVOS QUE DEBES EDITAR CON TUS DATOS.
#
# Aquí conectas el broker con la base de datos PostgreSQL donde viven
# los usuarios/ACL de MQTT (tablas test_user / test_acl).
#
# En Railway tienes DOS opciones:
#
#  A) Usar el plugin "PostgreSQL" de Railway (recomendado). Copia los
#     valores de Variables del servicio Postgres:
#       PGHOST / PGPORT / PGDATABASE / PGUSER / PGPASSWORD
#     y pégalos abajo en los campos marcados con [EDITA].
#     El host interno suele ser:  <servicio>.railway.internal
#
#  B) Definir tu propia base con los valores por defecto del repo
#     (chancayhuaral_auth / adminChancayHuaral / adminChancayHuaral123).
#
# Nota: Mosquitto NO expande variables de entorno en este archivo, por
# eso los valores deben quedar escritos literalmente.
# =================================================================

# --- 1. Conectividad Básica ---
listener 1883 0.0.0.0

# --- 2. Mitigación de DoS y Estabilidad (STRIDE) ---
max_connections 50
max_queued_messages 1000
message_size_limit 4096
persistence true
persistence_location /mosquitto/data/

# --- 3. Seguridad e Integridad (Mosquitto Go Auth) ---
allow_anonymous false
auth_plugin /mosquitto/go-auth.so

# --- 4. Backend de autenticación: PostgreSQL ---
auth_opt_backends postgres

auth_opt_pg_host     postgres-s-jr.railway.internal
auth_opt_pg_port     5432
auth_opt_pg_dbname   railway
auth_opt_pg_user     postgres
auth_opt_pg_password rXtigOcFQjwJBxPpdmwmwSVLcAHHlcUk

auth_opt_pg_sslmode  disable
auth_opt_hasher      bcrypt

# Consultas SQL del plugin (no cambiar).
# $1 = username, $2 = tipo de acceso (1 = SUB/lectura, 2 = PUB/escritura).
# La cláusula `rw = 3` habilita lectura y escritura simultáneas.
auth_opt_pg_userquery SELECT password_hash FROM test_user WHERE username = $1
auth_opt_pg_aclquery SELECT topic FROM test_acl WHERE username = $1 AND (rw = $2 OR rw = 3)
